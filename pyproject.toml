[project]
name = "benford-lens"
version = "1.0.0"
description = "Analyze Benford's Law on local CSV/Excel data, entirely on your own machine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.scripts]
benford-lens = "benford_lens.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benford_lens"]
