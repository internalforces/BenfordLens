[project]
name = "benford-lens"
version = "1.0.1"
description = "Analyze Benford's Law on local CSV/Excel data, entirely on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyside6-essentials>=6.7",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/internalforces/BenfordLens#readme"
Repository = "https://github.com/internalforces/BenfordLens"
Documentation = "https://github.com/internalforces/BenfordLens/tree/main/docs"
Issues = "https://github.com/internalforces/BenfordLens/issues"
Changelog = "https://github.com/internalforces/BenfordLens/blob/main/CHANGELOG.md"

[project.scripts]
benford-lens = "benford_lens.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.2",
    "mypy>=1.11",
    "pyinstaller>=6.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benford_lens"]
