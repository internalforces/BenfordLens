name: Release packages

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/release-notes/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "resources/**"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party_licenses/**"
      - "docs/qt-relinking.md"
      - "scripts/generate_third_party_licenses.py"
      - "tests/test_packaging_notices.py"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version and notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid project version: $project_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$project_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $project_version." >&2
              exit 1
            fi
          fi
          notes_path=".github/release-notes/$project_version.md"
          if [[ ! -f "$notes_path" ]]; then
            echo "Missing release notes: $notes_path" >&2
            exit 1
          fi
          echo "version=$project_version" >>"$GITHUB_OUTPUT"

  windows-x64:
    needs: release-metadata
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build and verify Windows ZIP and MSI
        shell: pwsh
        run: ./packaging/build-release-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Retain verified Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            dist/Benford-Lens-${{ env.RELEASE_VERSION }}-windows-x64.zip
            dist/Benford-Lens-${{ env.RELEASE_VERSION }}-windows-x64.zip.sha256
            dist/msi/Benford-Lens-${{ env.RELEASE_VERSION }}-windows-x64.msi
            dist/msi/Benford-Lens-${{ env.RELEASE_VERSION }}-windows-x64.msi.sha256
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    needs: release-metadata
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build and verify macOS ZIP
        run: ./packaging/build-release-macos.sh "$RELEASE_VERSION"

      - name: Retain verified macOS assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: |
            dist/Benford-Lens-${{ env.RELEASE_VERSION }}-macOS-arm64.zip
            dist/Benford-Lens-${{ env.RELEASE_VERSION }}-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-metadata, windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "Benford-Lens-$RELEASE_VERSION-macOS-arm64.zip"
            "Benford-Lens-$RELEASE_VERSION-macOS-arm64.zip.sha256"
            "Benford-Lens-$RELEASE_VERSION-windows-x64.msi"
            "Benford-Lens-$RELEASE_VERSION-windows-x64.msi.sha256"
            "Benford-Lens-$RELEASE_VERSION-windows-x64.zip"
            "Benford-Lens-$RELEASE_VERSION-windows-x64.zip.sha256"
          )
          mapfile -t actual < <(find release-assets -type f -exec basename {} \; | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          for filename in "${expected[@]}"; do
            source_path="$(find release-assets -type f -name "$filename" -print -quit)"
            target_path="release-assets/$filename"
            if [[ "$source_path" != "$target_path" ]]; then
              mv "$source_path" "$target_path"
            fi
          done
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_path=".github/release-notes/$RELEASE_VERSION.md"
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' >"$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already public; refusing to replace it." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Benford Lens $GITHUB_REF_NAME" \
              --notes-file "$notes_path"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Benford Lens $GITHUB_REF_NAME" \
              --notes-file "$notes_path"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-assets/* \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,assets \
            --jq '{url, isDraft, assets: [.assets[].name]}'
