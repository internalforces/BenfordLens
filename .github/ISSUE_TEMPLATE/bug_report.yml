name: Bug report
description: Report reproducible unexpected behavior using synthetic data only
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never upload a real or sensitive dataset, credential,
        personal information, or confidential log. Use a minimal synthetic CSV/XLSX file.
        Security-sensitive reports belong in the private form linked from SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Benford Lens version
      placeholder: "For example: 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows x64
        - macOS Apple Silicon
        - Linux or another unsupported target
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows MSI
        - Windows portable ZIP
        - macOS ZIP
        - Source checkout
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic values and remove private paths or identifying details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included real user data, credentials, personal information, or confidential files.
          required: true
